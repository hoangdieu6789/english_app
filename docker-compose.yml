services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: english_app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: migrate/migrate:v4.19.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/db/migrations:/migrations
    command:
      - "-database"
      - "postgres://postgres:postgres@postgres:5432/english_app?sslmode=disable"
      - "-path"
      - "/migrations"
      - "up"
    restart: "no"

  backend:
    build:
      context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      PORT: 8080
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/english_app?sslmode=disable
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret}
      JWT_REFRESH_PEPPER: ${JWT_REFRESH_PEPPER:-dev-refresh-pepper}
      FRONTEND_ORIGIN: http://localhost:3000
      COOKIE_SECURE: "false"
      AZURE_SPEECH_KEY: ${AZURE_SPEECH_KEY:-}
      AZURE_SPEECH_REGION: ${AZURE_SPEECH_REGION:-}
      AUDIO_STORAGE_DIR: /data/audio
      AUDIO_PUBLIC_URL_PREFIX: /uploads
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-nvidia/nemotron-3.5-super-vl:free}
      OPENROUTER_FALLBACK_MODELS: ${OPENROUTER_FALLBACK_MODELS:-google/gemma-4-31b-it:free}
      ALLOW_PAID_MODELS: ${ALLOW_PAID_MODELS:-false}
      AZURE_SPEECH_CONCURRENCY: ${AZURE_SPEECH_CONCURRENCY:-1}
      GRADER_MODEL: ${GRADER_MODEL:-}
      LLM_PROVIDERS: ${LLM_PROVIDERS:-openrouter}
      LLM_BRIDGE_URL: ${LLM_BRIDGE_URL:-http://host.docker.internal:8765}
      LLM_BRIDGE_TOKEN: ${LLM_BRIDGE_TOKEN:-}
      TRANSCRIBER: ${TRANSCRIBER:-whisper}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-sonnet}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-latest,gemini-3-flash-preview}
    # Reach the LLM bridge running on the host (tools/llm-bridge).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - audio_data:/data/audio
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8080/api
    depends_on:
      - backend
    environment:
      HOSTNAME: "0.0.0.0"
    ports:
      - "3000:3000"

volumes:
  pgdata:
  audio_data:
